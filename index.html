<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/ahala/cropped-LOGO-ECOPARK-Youtube.png" />
    <title>ECOPARK CAMEROUN — Parc de Loisirs, Nature, Restauration, Hébergement &amp; Formation à Yaoundé-Ahala</title>
    <meta
      name="description"
      content="À 15 min du centre de Yaoundé (Ahala Barrière, face station Tradex, RN3) : Parc animalier (gorille ToTo), Pirogue sur le lac, Piscine semi-olympique, Château des Saveurs, Hôtels Ewondo/Chanthel/Bene (10 000 à 45 000 FCFA) et Formation CFP MINEFOP."
    />

    <!-- Script synchrone anti-FOUC (Zéro clignotement au chargement) -->
    <script>
      (function () {
        try {
          var STORAGE_THEME_KEY = "eco-park-theme";
          var STORAGE_VISION_KEY = "eco-park-vision";
          var storedTheme = localStorage.getItem(STORAGE_THEME_KEY);
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

          var isDark = false;
          if (storedTheme === "dark") {
            isDark = true;
          } else if (storedTheme === "light") {
            isDark = false;
          } else {
            isDark = false; // Mode Clair Hybride par défaut comme en production
          }

          var root = document.documentElement;
          if (isDark) {
            root.classList.add("dark");
            root.setAttribute("data-theme", "dark");
          } else {
            root.classList.remove("dark");
            root.setAttribute("data-theme", "light");
          }

          var storedVision = localStorage.getItem(STORAGE_VISION_KEY);
          if (storedVision && storedVision !== "normal") {
            root.setAttribute("data-vision", storedVision);
          } else {
            root.removeAttribute("data-vision");
          }
        } catch (e) {
          console.warn("Theme anti-FOUC initialization fallback:", e);
        }
      })();
    </script>

    <!-- Polices officielles de la version en production : Barlow Semi Condensed & Source Sans 3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />
  </head>
