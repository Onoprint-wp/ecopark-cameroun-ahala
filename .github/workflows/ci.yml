name: ECOPARK Zero-Error Gate & Full QA Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-ecopark-360:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase PGlite test dependencies
        run: npm --prefix supabase/tests install

      - name: Run PostgreSQL / Supabase RLS & Governance Contract Tests (81 assertions)
        run: npm run test:db

      - name: Run Dual Data Layer Contract Tests (112 assertions)
        run: npm run test:data

      - name: Verify Zero U+2014 Em-Dash & JSON Syntax
        run: |
          node -e "
            const fs = require('fs');
            JSON.parse(fs.readFileSync('tokens.json', 'utf8'));
            JSON.parse(fs.readFileSync('etape0-site-live/content-snapshot.json', 'utf8'));
            JSON.parse(fs.readFileSync('etape0-site-live/manifest.json', 'utf8'));
            const html = fs.readFileSync('etape0-site-live/index.html', 'utf8');
            if (html.includes('\u2014')) { throw new Error('U+2014 detected in index.html'); }
            console.log('Zero-Error static verification passed.');
          "
